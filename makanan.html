<!DOCTYPE html>
<html>
<head>
    <title>Pesan Makanan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 p-10">
    <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-lg">
        <h2 class="text-2xl font-bold text-orange-600 mb-4">Menu Kantin</h2>
        <ul>
            <li class="flex justify-between border-b py-2"><span>Nasi Goreng</span> <button onclick="pesan('Nasi Goreng')" class="text-blue-500">Pesan</button></li>
            <li class="flex justify-between border-b py-2"><span>Mie Ayam</span> <button onclick="pesan('Mie Ayam')" class="text-blue-500">Pesan</button></li>
            <li class="flex justify-between border-b py-2"><span>Es Teh</span> <button onclick="pesan('Es Teh')" class="text-blue-500">Pesan</button></li>
        </ul>
        <div id="status" class="mt-4 p-3 bg-green-100 text-green-700 hidden"></div>
        <a href="index.html" class="block mt-4 text-sm text-gray-400 text-center"> Kembali ke Portal</a>
    </div>
    <script>
        function pesan(menu) {
            const s = document.getElementById('status');
            s.innerText = "Pesanan " + menu + " sedang diproses!";
            s.classList.remove('hidden');
        }
    </script>
</body>
</html>
