<!DOCTYPE html>
<html>
<head>
    <title>Kalkulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg">
        <h2 class="text-xl font-bold mb-4">Kalkulator Sederhana</h2>
        <input id="n1" type="number" class="border p-2 mb-2 w-full" placeholder="Angka 1">
        <input id="n2" type="number" class="border p-2 mb-2 w-full" placeholder="Angka 2">
        <div class="flex gap-2">
            <button onclick="hitung('+')" class="bg-blue-500 text-white px-4 py-2 rounded">+</button>
            <button onclick="hitung('-')" class="bg-red-500 text-white px-4 py-2 rounded">-</button>
            <button onclick="hitung('*')" class="bg-green-500 text-white px-4 py-2 rounded">x</button>
        </div>
        <h3 class="mt-4 text-2xl font-bold text-blue-600" id="hasil">Hasil: 0</h3>
        <a href="index.html" class="block mt-4 text-sm text-gray-400 text-center"> Kembali ke Portal</a>
    </div>
    <script>
        function hitung(op) {
            const a = parseFloat(document.getElementById('n1').value);
            const b = parseFloat(document.getElementById('n2').value);
            let res = 0;
            if(op=='+') res = a+b; if(op=='-') res = a-b; if(op=='*') res = a*b;
            document.getElementById('hasil').innerText = "Hasil: " + res;
        }
    </script>
</body>
</html>
